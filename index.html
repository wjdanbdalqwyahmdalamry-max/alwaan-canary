<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081225"><link rel="manifest" href="/manifest.webmanifest"><title>ألوان الكناري | Enterprise</title><style>
:root{--bg:#07111f;--panel:#0e1b2f;--panel2:#12243e;--text:#eef5ff;--muted:#9fb1c8;--cyan:#28d7ff;--green:#39e58c;--amber:#ffca57;--red:#ff667a;--line:#203652}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;background:radial-gradient(circle at 15% 10%,#173d6d 0,#07111f 36%),#07111f;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{background:rgba(7,17,31,.9);border-left:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}.brand img{width:55px;height:55px;border-radius:15px;object-fit:cover}.brand b{font-size:17px}.nav button{width:100%;border:0;background:transparent;color:#c7d5e8;text-align:right;padding:12px 13px;border-radius:12px;margin:3px 0}.nav button.active,.nav button:hover{background:linear-gradient(90deg,#153a62,#102944);color:white}.main{padding:22px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.badge{padding:7px 11px;border-radius:999px;background:#122d49;color:#9feaff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(145deg,rgba(18,36,62,.95),rgba(10,25,44,.94));border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 12px 35px #0003}.kpi .n{font-size:30px;font-weight:800;margin-top:8px}.muted{color:var(--muted);font-size:13px}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.cyan{color:var(--cyan)}.section{margin-top:18px}.section h2{margin:0 0 12px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:right}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#18304b;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select,.toolbar textarea{background:#09182b;border:1px solid var(--line);color:white;border-radius:10px;padding:10px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#173b61;color:white}.btn.primary{background:linear-gradient(135deg,#12bfe9,#2677ff)}.btn.green{background:#137c51}.module{display:none}.module.active{display:block}.charts{display:grid;grid-template-columns:2fr 1fr;gap:14px}.bar{height:14px;background:#13283f;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),#7c5cff);border-radius:99px}.list{display:grid;gap:10px}.item{padding:12px;border:1px solid var(--line);border-radius:13px;background:#0b1a2d}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at center,#183c69,#050b14)}.loginbox{width:min(430px,100%);background:#0b1829ee;border:1px solid #2b4868;border-radius:24px;padding:28px;box-shadow:0 25px 80px #0008;text-align:center}.loginbox img{width:120px;height:120px;object-fit:cover;border-radius:28px}.loginbox input{display:block;width:100%;margin:10px 0;padding:13px;border-radius:12px;border:1px solid var(--line);background:#081425;color:white}.loginbox .btn{width:100%;margin-top:8px}.mobile{display:none}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:5;right:-290px;width:270px;transition:.25s}.side.open{right:0}.mobile{display:block}.grid{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}.main{padding:15px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="login" class="login"><div class="loginbox"><img src="/assets/logo.jpg"><h1>مصنع ألوان الكناري</h1><p class="muted">نظام الإدارة الصناعية المتكامل</p><input id="user" placeholder="اسم المستخدم / الكود"><input id="pass" type="password" placeholder="كلمة المرور"><button class="btn primary" onclick="login()">دخول النظام</button><p class="muted">نسخة Enterprise 4.0</p></div></div><div id="app" class="app" style="display:none"><aside id="side" class="side"><div class="brand"><img src="/assets/logo.jpg"><div><b>ألوان الكناري</b><div class="muted">Enterprise OS</div></div></div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><button class="btn mobile" onclick="document.getElementById('side').classList.toggle('open')">☰</button> <span class="badge">● متصل بالنظام</span></div><div><b id="who">مدير النظام</b></div></div><div id="content"></div></main></div><script>
const modules=[['home','لوحة القيادة','⌂'],['production','الإنتاج و MES','🏭'],['maintenance','الصيانة CMMS','🔧'],['employees','الموظفون HR','👥'],['attendance','الحضور والورديات','🕘'],['inventory','المخزون وقطع الغيار','📦'],['procurement','المشتريات والموردون','🛒'],['quality','الجودة QMS','✅'],['safety','السلامة HSE','🦺'],['alerts','البلاغات','🚨'],['reports','التقارير والتحليلات','📊'],['admin','الإدارة والصلاحيات','🔐']];
const data={machines:[['غازي 1','تعبئة غازي 1'],['غازي 1','نفخ آلي 2'],['غازي 1','ليبل غازي 1'],['غازي 1','شرنك غازي 1'],['غازي 2','تعبئة غازي 2'],['غازي 2','نفخ آلي 3'],['كانجو 1','تعبئة كانجو 1'],['كانجو 2','تعبئة كانجو 2'],['حلو رياضي','تعبئة حلو رياضي'],['تتراباك','تتراباك 1'],['تتراباك','تتراباك 2'],['تتراباك','تتراباك 3'],['تتراباك','تتراباك 4'],['تتراباك','تتراباك 5']]};
function login(){localStorage.alwaanUser=document.getElementById('user').value||'1';document.getElementById('login').style.display='none';document.getElementById('app').style.display='grid';document.getElementById('who').textContent='المستخدم: '+localStorage.alwaanUser;renderNav();show('home')}
function renderNav(){document.getElementById('nav').innerHTML=modules.map(m=>`<button id="n-${m[0]}" onclick="show('${m[0]}')">${m[2]} &nbsp; ${m[1]}</button>`).join('')}
function show(id){document.querySelectorAll('.module').forEach(x=>x.classList.remove('active'));modules.forEach(m=>document.getElementById('n-'+m[0])?.classList.remove('active'));document.getElementById('n-'+id)?.classList.add('active');document.getElementById('content').innerHTML=pages[id]();}
function kpi(t,n,c=''){return `<div class="card kpi"><div class="muted">${t}</div><div class="n ${c}">${n}</div></div>`}
const pages={
home:()=>`<section><h1>مركز القيادة الصناعية</h1><p class="muted">صورة لحظية عن المصنع — إنتاج، صيانة، موظفون، جودة، سلامة ومخزون.</p><div class="grid">${kpi('OEE العام','86.4%','good')}${kpi('إنتاج اليوم','428,650','cyan')}${kpi('التالف','2.8%','warn')}${kpi('أعطال مفتوحة','7','bad')}</div><div class="charts section"><div class="card"><h2>أداء الخطوط</h2>${['الغازي 1','الغازي 2','الكانجو 1','الكانجو 2','الحلو الرياضي','تتراباك'].map((x,i)=>`<div class="item"><b>${x}</b><div class="bar" style="margin-top:7px"><i style="width:${88-i*5}%"></i></div><small>${88-i*5}% OEE</small></div>`).join('')}</div><div class="card"><h2>أهم التنبيهات</h2><div class="list"><div class="item bad">🔧 عطل ميكانيكي — تعبئة غازي 1</div><div class="item warn">⚠️ ارتفاع نسبة التالف — كانجو 2</div><div class="item cyan">📋 طلب صيانة وقائية مستحق</div><div class="item">👷 غياب 4 موظفين</div></div></div></div></section>`,
production:()=>`<section><h1>الإنتاج و MES</h1><div class="toolbar"><input placeholder="بحث عن ماكينة"><select><option>كل الخطوط</option><option>الغازي 1</option><option>الغازي 2</option><option>الكانجو 1</option><option>الكانجو 2</option><option>تتراباك</option></select><button class="btn primary">+ أمر إنتاج</button></div><div class="card"><table class="table"><tr><th>الخط</th><th>الماكينة</th><th>السابق</th><th>النهائي</th><th>الإنتاج</th><th>الصالح</th><th>التالف</th><th>OEE</th></tr>${data.machines.map((m,i)=>`<tr><td>${m[0]}</td><td>${m[1]}</td><td>${100000+i*3000}</td><td>${100000+i*3000+18500}</td><td class="cyan">18,500</td><td class="good">18,020</td><td class="bad">480</td><td>${84+i%9}%</td></tr>`).join('')}</table></div></section>`,
maintenance:()=>`<section><h1>الصيانة المتكاملة CMMS</h1><div class="grid">${kpi('أوامر مفتوحة','12','bad')}${kpi('وقائية مستحقة','5','warn')}${kpi('MTTR','42 دقيقة','cyan')}${kpi('MTBF','118 ساعة','good')}</div><div class="charts section"><div class="card"><h2>أوامر العمل</h2><table class="table"><tr><th>رقم</th><th>الماكينة</th><th>النوع</th><th>الأولوية</th><th>الحالة</th></tr>${[['WO-1024','تعبئة غازي 1','تصحيحية','عالية','قيد التنفيذ'],['WO-1025','نفخ آلي 3','وقائية','متوسطة','مجدولة'],['WO-1026','تتراباك 4','تصحيحية','حرجة','مفتوحة'],['WO-1027','شرنك كروز 2','وقائية','منخفضة','مكتملة']].map(r=>`<tr>${r.map((v,j)=>`<td class="${j==3&&v==='حرجة'?'bad':''}">${v}</td>`).join('')}</tr>`).join('')}</table></div><div class="card"><h2>إدارة الأصول</h2><div class="list"><div class="item">📋 سجل الأصول والمواصفات</div><div class="item">🗓️ خطط الصيانة الوقائية</div><div class="item">🔩 قطع الغيار</div><div class="item">📈 MTBF / MTTR / Availability</div><div class="item">🧾 سجل تاريخ كل ماكينة</div></div></div></div></section>`,
employees:()=>`<section><h1>نظام الموظفين HR</h1><div class="grid">${kpi('إجمالي الموظفين','286')}${kpi('حاضرون اليوم','271','good')}${kpi('إجازات','8','warn')}${kpi('غياب','7','bad')}</div><div class="card section"><div class="toolbar"><input placeholder="بحث بالرقم أو الاسم"><button class="btn primary">+ موظف</button><button class="btn">استيراد Excel</button></div><table class="table"><tr><th>الرقم</th><th>الموظف</th><th>القسم</th><th>الوظيفة</th><th>الحالة</th><th>التدريب</th></tr>${[['EMP-001','أحمد محمد','الإنتاج','مشغل ماكينة','نشط','92%'],['EMP-002','محمد علي','الصيانة','فني ميكانيكا','نشط','100%'],['EMP-003','علي حسن','الجودة','مفتش جودة','إجازة','88%'],['EMP-004','خالد أحمد','المخازن','أمين مخزن','نشط','76%']].map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</table></div></section>`,
attendance:()=>`<section><h1>الحضور والورديات</h1><div class="card"><div class="toolbar"><input type="date"><select><option>A</option><option>B</option><option>C</option></select><button class="btn primary">تسجيل حضور</button></div><table class="table"><tr><th>الموظف</th><th>بداية</th><th>منتصف الوردية</th><th>النهاية</th><th>الحالة</th><th>إضافي</th></tr>${['أحمد محمد','محمد علي','علي حسن','خالد أحمد'].map((x,i)=>`<tr><td>${x}</td><td>06:58</td><td>${i===2?'غياب':'12:00'}</td><td>15:10</td><td class="${i===2?'bad':'good'}">${i===2?'غائب':'حاضر'}</td><td>10 د</td></tr>`).join('')}</table></div></section>`,
inventory:()=>`<section><h1>المخزون وقطع الغيار</h1><div class="grid">${kpi('قيمة المخزون','$184K','cyan')}${kpi('أصناف تحت الحد','14','bad')}${kpi('طلبات صرف','9','warn')}${kpi('قطع حرجة','23','good')}</div><div class="card section"><table class="table"><tr><th>رقم القطعة</th><th>القطعة</th><th>المخزون</th><th>الحد الأدنى</th><th>الموقع</th><th>الحالة</th></tr>${[['SP-001','رولمان بلي 6205','4','10','مخزن A','إعادة طلب'],['SP-002','سير ناقل','22','8','مخزن B','جيد'],['SP-003','حساس حرارة','2','5','مخزن A','حرج'],['SP-004','صمام هواء','18','10','مخزن C','جيد']].map(r=>`<tr>${r.map((v,j)=>`<td class="${j===5&&v!=='جيد'?'bad':''}">${v}</td>`).join('')}</tr>`).join('')}</table></div></section>`,
procurement:()=>`<section><h1>المشتريات والموردون</h1><div class="grid">${kpi('طلبات قيد الموافقة','11')}${kpi('طلبات الشراء هذا الشهر','48','cyan')}${kpi('موردون نشطون','37','good')}${kpi('متوسط زمن التوريد','6.4 يوم','warn')}</div><div class="card section"><div class="toolbar"><button class="btn primary">+ طلب شراء</button><button class="btn">الموردون</button><button class="btn">عروض الأسعار</button><button class="btn">أوامر الشراء</button></div><p class="muted">دورة كاملة: طلب → موافقة → عروض → ترسية → أمر شراء → استلام → تقييم المورد.</p></div></section>`,
quality:()=>`<section><h1>الجودة QMS</h1><div class="grid">${kpi('حالات مفتوحة','6','bad')}${kpi('فحص ناجح','97.3%','good')}${kpi('CAPA مفتوحة','4','warn')}${kpi('شكاوى الشهر','3','cyan')}</div><div class="card section"><div class="list"><div class="item">🔬 خطط الفحص والعينات</div><div class="item">🧪 نتائج المختبر والمواصفات</div><div class="item">⚠️ NCR — عدم مطابقة</div><div class="item">🎯 CAPA — إجراءات تصحيحية ووقائية</div><div class="item">🔎 تتبع المنتج والدفعة</div><div class="item">📋 تدقيق داخلي وخارجي</div></div></div></section>`,
safety:()=>`<section><h1>السلامة HSE</h1><div class="grid">${kpi('حوادث الشهر','1','bad')}${kpi('أيام بدون إصابة','37','good')}${kpi('تفتيشات مستحقة','3','warn')}${kpi('مخاطر مفتوحة','8','cyan')}</div><div class="card section"><div class="toolbar"><button class="btn primary">+ بلاغ حادث</button><button class="btn">تقييم مخاطر</button><button class="btn">تفتيش</button><button class="btn">تصاريح عمل</button></div><p class="muted">إدارة الحوادث، المخاطر، PPE، تصاريح العمل، التحقيقات والإجراءات التصحيحية.</p></div></section>`,
alerts:()=>`<section><h1>مركز البلاغات الموحد</h1><div class="toolbar"><select><option>كل الأنواع</option><option>تقني</option><option>جودة</option><option>تشغيلي</option><option>سلامة</option></select><select><option>كل الأولويات</option><option>حرج</option><option>عالي</option><option>متوسط</option></select><button class="btn primary">+ بلاغ جديد</button></div><div class="list">${[['ALT-1021','تقني','حرج','تعبئة غازي 1','اهتزاز غير طبيعي','قيد التنفيذ'],['ALT-1022','جودة','عالي','كانجو 2','انحراف السكر','مستلم'],['ALT-1023','سلامة','عالي','تتراباك 3','تسرب ماء قرب اللوحة','مفتوح'],['ALT-1024','تشغيلي','متوسط','غازي 2','نقص خامة','مغلق']].map(r=>`<div class="item"><b>${r[0]}</b> — ${r[1]} — <span class="${r[2]==='حرج'?'bad':'warn'}">${r[2]}</span><br>${r[3]}: ${r[4]}<br><span class="muted">الحالة: ${r[5]}</span></div>`).join('')}</div></section>`,
reports:()=>`<section><h1>التقارير والتحليلات</h1><div class="grid">${kpi('OEE','86.4%','good')}${kpi('Availability','92.1%','cyan')}${kpi('Performance','94.0%','cyan')}${kpi('Quality','99.0%','good')}</div><div class="card section"><div class="list"><div class="item">📊 تقرير الإنتاج حسب الماكينة/الخط/اليوم</div><div class="item">♻️ تقرير الهدر ونسبة التالف</div><div class="item">⏱️ Pareto أسباب التوقف</div><div class="item">🔧 MTBF / MTTR / تكلفة الصيانة</div><div class="item">👥 الحضور والإجازات والعمل الإضافي</div><div class="item">📦 المخزون وحركة قطع الغيار</div><div class="item">✅ الجودة وCAPA</div><div class="item">🦺 السلامة والحوادث</div></div></div></section>`,
admin:()=>`<section><h1>الإدارة والأمن</h1><div class="grid">${kpi('المستخدمون','18')}${kpi('الأدوار','9')}${kpi('سجل التدقيق','2,418','cyan')}${kpi('أجهزة متصلة','31','good')}</div><div class="card section"><div class="list"><div class="item">🔐 RBAC — صلاحيات حسب الدور والقسم والخط والماكينة</div><div class="item">🧾 Audit Trail — لا حذف صامت للبيانات</div><div class="item">🔑 تغيير كلمات المرور وسياسة الدخول</div><div class="item">📥 استيراد الموظفين من Excel</div><div class="item">⚙️ إدارة الماكينات والمنتجات وأسباب التوقف</div><div class="item">🗂️ إدارة النماذج والوثائق والإصدارات</div></div></div></section>`};
if(localStorage.alwaanUser) login();
</script></body></html>
